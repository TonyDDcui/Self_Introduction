<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册详情 | 崔喆箫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --bg-elevated: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: rgba(0,0,0,0.06);
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius: 20px;
            --radius-lg: 28px;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg-elevated: #1c1c1e;
            --text: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --border: rgba(255,255,255,0.08);
            --glass-bg: rgba(28, 28, 30, 0.72);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            scroll-behavior: smooth;
            font-size: 17px;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 52px;
            padding: 0 max(48px, calc((100vw - 1200px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--glass-border);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .nav-back:hover {
            opacity: 0.8;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .theme-toggle:hover {
            opacity: 1;
            background: var(--border);
        }

        /* Content */
        .detail-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 48px 80px;
        }

        .detail-header {
            margin-bottom: 48px;
        }

        .detail-date {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .detail-desc {
            font-size: 1.0625rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 48px;
        }

        .photo-item {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            background: var(--bg-elevated);
            aspect-ratio: 4/3;
            transition: transform 0.3s ease;
        }

        .photo-item:hover {
            transform: scale(1.01);
        }

        .photo-item.featured {
            grid-column: span 2;
            aspect-ratio: 16/9;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.03);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--radius);
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lightbox-nav:hover {
            background: rgba(255,255,255,0.2);
        }

        .lightbox-nav.prev { left: -80px; }
        .lightbox-nav.next { right: -80px; }

        .lightbox-counter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 0.9375rem;
        }

        /* Navigation between albums */
        .album-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 48px;
            border-top: 1px solid var(--border);
            margin-top: 48px;
        }

        .album-nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: var(--bg-elevated);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            border: 0.5px solid var(--border);
        }

        .album-nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .album-nav-btn.next {
            flex-direction: row-reverse;
            text-align: right;
        }

        .album-nav-btn .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .album-nav-btn .title {
            font-size: 0.9375rem;
            font-weight: 500;
        }

        /* Fade Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in-stagger > * {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-in-stagger.visible > * {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in-stagger.visible > *:nth-child(1) { transition-delay: 0.05s; }
        .fade-in-stagger.visible > *:nth-child(2) { transition-delay: 0.1s; }
        .fade-in-stagger.visible > *:nth-child(3) { transition-delay: 0.15s; }
        .fade-in-stagger.visible > *:nth-child(4) { transition-delay: 0.2s; }
        .fade-in-stagger.visible > *:nth-child(5) { transition-delay: 0.25s; }

        /* Responsive */
        @media (max-width: 768px) {
            .nav {
                padding: 0 24px;
            }
            .detail-content {
                padding: 90px 24px 60px;
            }
            .photo-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .photo-item.featured {
                grid-column: span 1;
                aspect-ratio: 4/3;
            }
            .lightbox-nav {
                display: none;
            }
            .lightbox-close {
                top: 20px;
                right: 20px;
                background: rgba(0,0,0,0.5);
            }
            .album-nav {
                flex-direction: column;
                gap: 16px;
            }
            .album-nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="life.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回相册
        </a>
        <div class="nav-actions">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Content -->
    <main class="detail-content">
        <header class="detail-header fade-in">
            <div class="detail-date" id="albumDate">2025年3月15日</div>
            <h1 class="detail-title" id="albumTitle">周末的咖啡馆时光</h1>
            <p class="detail-desc" id="albumDesc">在城市的角落里发现了一家安静的咖啡馆，阳光透过窗户洒进来，一切都刚刚好。这是一个完美的周末下午，没有工作的压力，只有咖啡的香气和书页的翻动声。</p>
        </header>

        <div class="photo-grid fade-in-stagger" id="photoGrid">
            <!-- Photos will be loaded by JS -->
        </div>

        <!-- Album Navigation -->
        <nav class="album-nav fade-in">
            <a href="life-detail.html?id=0" class="album-nav-btn prev" id="prevAlbum">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <div>
                    <div class="label">上一个相册</div>
                    <div class="title" id="prevTitle">城市夜景漫步</div>
                </div>
            </a>
            <a href="life-detail.html?id=2" class="album-nav-btn next" id="nextAlbum">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <div>
                    <div class="label">下一个相册</div>
                    <div class="title" id="nextTitle">山间徒步之旅</div>
                </div>
            </a>
        </nav>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <button class="lightbox-nav prev" onclick="changePhoto(-1, event)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <div class="lightbox-counter" id="lightboxCounter">1 / 5</div>
        </div>
        <button class="lightbox-nav next" onclick="changePhoto(1, event)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </div>

    <script>
        // Album Data
        const albums = [
            {
                id: 1,
                date: '2025年3月15日',
                title: '周末的咖啡馆时光',
                desc: '在城市的角落里发现了一家安静的咖啡馆，阳光透过窗户洒进来，一切都刚刚好。这是一个完美的周末下午，没有工作的压力，只有咖啡的香气和书页的翻动声。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img1.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img1_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img1_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img1_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img1_5.jpg'
                ]
            },
            {
                id: 2,
                date: '2025年2月28日',
                title: '城市夜景漫步',
                desc: '夜幕降临，华灯初上。站在高处俯瞰这座城市的灯火，感受都市的脉搏。霓虹闪烁，车水马龙，这是属于夜晚的独特魅力。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img2_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img2_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img2_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img2_5.jpg'
                ]
            },
            {
                id: 3,
                date: '2025年2月10日',
                title: '山间徒步之旅',
                desc: '远离城市的喧嚣，走进大自然。山间的空气清新，每一步都是与自然的对话。登顶的那一刻，所有的疲惫都化作了成就感。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img3_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img3_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img3_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img3_5.jpg'
                ]
            },
            {
                id: 4,
                date: '2025年1月20日',
                title: '书店里的午后',
                desc: '在书架间穿梭，偶然发现一本好书。时间在这里仿佛静止了，只有翻页的声音和偶尔传来的咖啡香。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img4_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img4_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img4_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img4_5.jpg'
                ]
            },
            {
                id: 5,
                date: '2025年1月5日',
                title: '新年的第一场雪',
                desc: '雪花飘落，世界变成白色。这是新年最好的礼物，也是冬天最美的风景。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img5.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img5_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img5_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img5_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img5_5.jpg'
                ]
            },
            {
                id: 6,
                date: '2024年12月',
                title: '美食探索日记',
                desc: '生活中的小确幸，往往藏在美食里。记录每一次味蕾的惊喜，分享每一份美味的快乐。',
                photos: [
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img6.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img6_2.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img6_3.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img6_4.jpg',
                    'https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/life_img/img6_5.jpg'
                ]
            }
        ];

        // Get album ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = parseInt(urlParams.get('id')) || 1;
        const album = albums.find(a => a.id === currentId) || albums[0];

        // Update page content
        document.getElementById('albumDate').textContent = album.date;
        document.getElementById('albumTitle').textContent = album.title;
        document.getElementById('albumDesc').textContent = album.desc;

        // Generate photo grid
        const photoGrid = document.getElementById('photoGrid');
        album.photos.forEach((photo, index) => {
            const item = document.createElement('div');
            item.className = 'photo-item' + (index === 0 ? ' featured' : '');
            item.onclick = () => openLightbox(index);
            item.innerHTML = '<img src="' + photo + '" alt="照片" loading="lazy">';
            photoGrid.appendChild(item);
        });

        // Update navigation
        const currentIndex = albums.findIndex(a => a.id === currentId);
        const prevAlbum = albums[currentIndex - 1];
        const nextAlbum = albums[currentIndex + 1];

        if (prevAlbum) {
            document.getElementById('prevAlbum').href = 'life-detail.html?id=' + prevAlbum.id;
            document.getElementById('prevTitle').textContent = prevAlbum.title;
        } else {
            document.getElementById('prevAlbum').style.visibility = 'hidden';
        }

        if (nextAlbum) {
            document.getElementById('nextAlbum').href = 'life-detail.html?id=' + nextAlbum.id;
            document.getElementById('nextTitle').textContent = nextAlbum.title;
        } else {
            document.getElementById('nextAlbum').style.visibility = 'hidden';
        }

        // Lightbox
        let currentPhotoIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCounter = document.getElementById('lightboxCounter');

        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event && (event.target === lightbox || event.target.closest('.lightbox-close'))) {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function updateLightbox() {
            lightboxImage.src = album.photos[currentPhotoIndex];
            lightboxCounter.textContent = (currentPhotoIndex + 1) + ' / ' + album.photos.length;
        }

        function changePhoto(direction, event) {
            event.stopPropagation();
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = album.photos.length - 1;
            if (currentPhotoIndex >= album.photos.length) currentPhotoIndex = 0;
            updateLightbox();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changePhoto(-1, { stopPropagation: () => {} });
            if (e.key === 'ArrowRight') changePhoto(1, { stopPropagation: () => {} });
        });

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
            }
        }

        // Init theme
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        })();

        // Scroll Animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(el => {
            observer.observe(el);
        });

        setTimeout(() => {
            document.querySelectorAll('.fade-in').forEach(el => {
                el.classList.add('visible');
            });
        }, 100);
    </script>
</body>
</html>
