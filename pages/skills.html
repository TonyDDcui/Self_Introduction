<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能栈 | 崔喆箫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --bg-elevated: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: rgba(0,0,0,0.06);
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg-elevated: #1c1c1e;
            --text: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --border: rgba(255,255,255,0.08);
            --glass-bg: rgba(28, 28, 30, 0.72);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 17px; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 52px;
            padding: 0 max(48px, calc((100vw - 1200px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--glass-border);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .nav-back:hover { opacity: 0.8; }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .theme-toggle:hover { opacity: 1; background: var(--border); }

        .page-header {
            padding: 140px 48px 60px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        .skills-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 48px 120px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .skill-card {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 36px;
            border: 0.5px solid var(--border);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .skill-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        .skill-card h3 {
            font-size: 1.3125rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .skill-card p {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 6px 14px;
            background: var(--bg);
            border-radius: 100px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            border: 0.5px solid var(--border);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible { opacity: 1; transform: translateY(0); }

        .fade-in-stagger > * {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-in-stagger.visible > * { opacity: 1; transform: translateY(0); }
        .fade-in-stagger.visible > *:nth-child(1) { transition-delay: 0.1s; }
        .fade-in-stagger.visible > *:nth-child(2) { transition-delay: 0.15s; }
        .fade-in-stagger.visible > *:nth-child(3) { transition-delay: 0.2s; }
        .fade-in-stagger.visible > *:nth-child(4) { transition-delay: 0.25s; }

        @media (max-width: 768px) {
            .page-header { padding: 120px 24px 40px; }
            .skills-container { padding: 0 24px 80px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="../index.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </nav>

    <header class="page-header fade-in">
        <h1>技能栈</h1>
        <p>持续学习，不断精进</p>
    </header>

    <div class="skills-container fade-in-stagger">
        <div class="skill-card">
            <div class="skill-icon">⚡</div>
            <h3>嵌入式开发</h3>
            <p>精通 C 语言，熟练使用 STM32 系列芯片进行产品开发，具备 RTOS 实战经验。</p>
            <div class="skill-tags">
                <span class="skill-tag">C语言</span>
                <span class="skill-tag">STM32</span>
                <span class="skill-tag">FreeRTOS</span>
                <span class="skill-tag">51单片机</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🔌</div>
            <h3>硬件设计</h3>
            <p>具备电路设计与 PCB 绘制能力，熟悉常用传感器与通信协议。</p>
            <div class="skill-tags">
                <span class="skill-tag">PCB设计</span>
                <span class="skill-tag">I2C/SPI</span>
                <span class="skill-tag">UART</span>
                <span class="skill-tag">传感器</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🌐</div>
            <h3>物联网</h3>
            <p>熟悉 IoT 领域常见协议与云平台对接，具备端到端解决方案能力。</p>
            <div class="skill-tags">
                <span class="skill-tag">MQTT</span>
                <span class="skill-tag">WiFi</span>
                <span class="skill-tag">蓝牙</span>
                <span class="skill-tag">ESP8266</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🛠️</div>
            <h3>开发工具</h3>
            <p>熟练使用各类开发工具，注重代码质量与版本管理。</p>
            <div class="skill-tags">
                <span class="skill-tag">Git</span>
                <span class="skill-tag">Keil</span>
                <span class="skill-tag">VS Code</span>
                <span class="skill-tag">Altium Designer</span>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
            }
        }

        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        })();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(el => observer.observe(el));
    </script>
</body>
</html>
