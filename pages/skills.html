<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能栈 | 崔喆箫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 统一的设计系统 -->
    <link rel="stylesheet" href="../static/css/design-system.css">
    <link rel="stylesheet" href="../static/css/animations.css">

    <style>
        :root {
            --page-padding: 48px;
            --page-padding-mobile: 24px;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--navbar-height);
            padding: 0 max(var(--page-padding), calc((100vw - 1200px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 20, 40, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
            transition: all var(--transition-base);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-accent-primary);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .nav-back:hover { opacity: 0.8; }

        button[data-theme-toggle] {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--color-text-primary);
            cursor: pointer;
            opacity: 0.6;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
        }

        button[data-theme-toggle]:hover { opacity: 1; background: var(--color-border); }

        .page-header {
            padding: calc(var(--navbar-height) + 60px) var(--page-padding) 60px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            background: var(--color-accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            color: var(--color-text-secondary);
            font-size: 1.125rem;
        }

        .skills-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 var(--page-padding) 120px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .skill-card {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: 36px;
            border: 1px solid var(--color-border);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .skill-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--color-shadow-lg);
        }

        .skill-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--color-accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        .skill-card h3 {
            font-size: 1.3125rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .skill-card p {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 6px 14px;
            background: var(--color-bg-tertiary);
            border-radius: 100px;
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible { opacity: 1; transform: translateY(0); }

        .fade-in-stagger > * {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-in-stagger.visible > * { opacity: 1; transform: translateY(0); }
        .fade-in-stagger.visible > *:nth-child(1) { transition-delay: 0.1s; }
        .fade-in-stagger.visible > *:nth-child(2) { transition-delay: 0.15s; }
        .fade-in-stagger.visible > *:nth-child(3) { transition-delay: 0.2s; }
        .fade-in-stagger.visible > *:nth-child(4) { transition-delay: 0.25s; }

        @media (max-width: 768px) {
            .page-header { padding: calc(var(--navbar-height) + 40px) var(--page-padding-mobile) 40px; }
            .skills-container { padding: 0 var(--page-padding-mobile) 80px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="dark">
    <nav class="nav">
        <a href="../index.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <button data-theme-toggle title="切换主题">🌙</button>
    </nav>

    <header class="page-header fade-in">
        <h1>技能栈</h1>
        <p>持续学习，不断精进</p>
    </header>

    <div class="skills-container fade-in-stagger">
        <div class="skill-card">
            <div class="skill-icon">⚡</div>
            <h3>嵌入式开发</h3>
            <p>精通 C 语言，熟练使用 STM32 系列芯片进行产品开发，具备 RTOS 实战经验。</p>
            <div class="skill-tags">
                <span class="skill-tag">C语言</span>
                <span class="skill-tag">STM32</span>
                <span class="skill-tag">FreeRTOS</span>
                <span class="skill-tag">51单片机</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🔌</div>
            <h3>硬件设计</h3>
            <p>具备电路设计与 PCB 绘制能力，熟悉常用传感器与通信协议。</p>
            <div class="skill-tags">
                <span class="skill-tag">PCB设计</span>
                <span class="skill-tag">I2C/SPI</span>
                <span class="skill-tag">UART</span>
                <span class="skill-tag">传感器</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🌐</div>
            <h3>物联网</h3>
            <p>熟悉 IoT 领域常见协议与云平台对接，具备端到端解决方案能力。</p>
            <div class="skill-tags">
                <span class="skill-tag">MQTT</span>
                <span class="skill-tag">WiFi</span>
                <span class="skill-tag">蓝牙</span>
                <span class="skill-tag">ESP8266</span>
            </div>
        </div>

        <div class="skill-card">
            <div class="skill-icon">🛠️</div>
            <h3>开发工具</h3>
            <p>熟练使用各类开发工具，注重代码质量与版本管理。</p>
            <div class="skill-tags">
                <span class="skill-tag">Git</span>
                <span class="skill-tag">Keil</span>
                <span class="skill-tag">VS Code</span>
                <span class="skill-tag">Altium Designer</span>
            </div>
        </div>
    </div>

    <script src="../static/js/main.js"></script>
    <script>
        // 使用主 JS 中的 IntersectionObserver 来处理 fade-in 动画
        (function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(el => observer.observe(el));
        })();
    </script>
</body>
</html>
