            background-clip: text;
        }

        .page-subtitle { color: var(--color-text-secondary); font-size: 1rem; }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            padding-bottom: 80px;
        }

        .album-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            text-decoration: none;
            color: var(--color-text-primary);
            transition: border-color var(--transition-base), box-shadow var(--transition-base);
        }

        .album-card:hover {
            border-color: var(--color-text-secondary);
            box-shadow: var(--color-shadow-md);
        }

        .album-cover {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-base);
        }

        .album-card:hover .album-cover img { transform: scale(1.04); }

        .album-count {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            font-size: 0.6875rem;
            color: white;
        }

        .album-body { padding: 16px; }

        .album-date {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }

        .album-title {
            font-size: 0.9375rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .album-desc {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .fade-up { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .container { padding: 0 var(--page-padding-mobile); }
            .nav { padding: 0 var(--page-padding-mobile); }
            .albums-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        // 使用�?JS 中的 IntersectionObserver 来处�?fade-up 动画
        (function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        })();
    </script>
