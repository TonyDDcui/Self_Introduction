<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生旅程 | 崔喆箫</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/github-header.css">
  <link rel="stylesheet" href="../assets/css/subpage.css">
  <style>
    .gallery-section { padding: 120px 0 60px; }
    .gallery-header { text-align: center; margin-bottom: 48px; }
    .gallery-header h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 16px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    @media (max-width: 768px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; } }
    .gallery-card { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; cursor: pointer; transition: transform 0.3s ease; background: var(--bg-secondary); }
    .gallery-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.3); }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .gallery-card:hover img { transform: scale(1.05); }
    .gallery-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: white; opacity: 0; transition: opacity 0.3s ease; }
    .gallery-card:hover .gallery-overlay { opacity: 1; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 0.875rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--accent-primary); text-decoration: none; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 24px; cursor: pointer; }
  </style>
</head>
<body>
  <header class="github-header">
    <div class="header-container">
      <div class="header-left"><button class="hamburger-btn"><span></span><span></span><span></span></button></div>
      <div class="header-center"><a href="../index.html" class="brand-link">CZX</a></div>
      <div class="header-right">
        <button class="theme-btn" id="theme-btn"><svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 12a4 4 0 100-8 4 4 0 000 8z"/></svg></button>
      </div>
    </div>
  </header>
  <main class="gallery-section">
    <div class="container">
      <nav class="breadcrumb"><a href="../index.html">首页</a><span>/</span><span>人生旅程</span></nav>
      <div class="gallery-header"><h1>人生旅程</h1><p style="color:var(--text-secondary)">探索世界，记录美好</p></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </main>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img src="" alt="" id="lightbox-img">
  </div>
  <script src="../assets/js/main.js"></script>
  <script>
    const images = [
      { src: '../../submodules/Journey_of_Life/life_img/img1.jpg', title: '旅程 1' },
      { src: '../../submodules/Journey_of_Life/life_img/img3.jpg', title: '旅程 2' },
      { src: '../../submodules/Journey_of_Life/life_img/img5.jpg', title: '旅程 3' },
      { src: '../../submodules/Journey_of_Life/life_img/img7.jpg', title: '旅程 4' },
      { src: '../../submodules/Journey_of_Life/life_img/img9.jpg', title: '旅程 5' },
      { src: '../../submodules/Journey_of_Life/life_img/img11.jpg', title: '旅程 6' }
    ];
    const grid = document.getElementById('gallery-grid');
    images.forEach((img, i) => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.innerHTML = '<img src="'+img.src+'" alt="'+img.title+'" loading="lazy" onerror="this.style.display=\'none\'"><div class="gallery-overlay"><h3>'+img.title+'</h3></div>';
      card.onclick = () => openLightbox(i);
      grid.appendChild(card);
    });
    let currentIdx = 0;
    function openLightbox(i) { currentIdx = i; document.getElementById('lightbox-img').src = images[i].src; document.getElementById('lightbox').classList.add('active'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
    document.getElementById('lightbox').onclick = (e) => { if(e.target.id === 'lightbox') closeLightbox(); };
  </script>
</body>
</html>
