<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目作品 | 崔喆箫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --text-tertiary: #6e7681;
            --accent: #58a6ff;
            --border: #30363d;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --text: #1f2328;
            --text-secondary: #656d76;
            --text-tertiary: #8c959f;
            --accent: #0969da;
            --border: #d0d7de;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        [data-theme="light"] .nav { background: rgba(255,255,255,0.85); }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .nav-back:hover { color: var(--text); }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-btn:hover { color: var(--text); border-color: var(--text-secondary); }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

        .page-header {
            padding: 120px 0 48px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 48px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-subtitle { color: var(--text-secondary); font-size: 1rem; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            padding-bottom: 80px;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .project-card:hover { border-color: var(--text-tertiary); }

        .project-image {
            height: 180px;
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .project-card:hover .project-image img { transform: scale(1.04); }

        .project-content { padding: 20px; }

        .project-content h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .project-content p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .project-tag {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 100px;
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }

        .fade-up { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .nav { padding: 0 20px; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <button class="theme-btn" onclick="toggleTheme()">
            <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2"/>
            </svg>
        </button>
    </nav>

    <div class="container">
        <header class="page-header fade-up">
            <h1 class="page-title">
                <span>🚀</span>
                项目作品
            </h1>
            <p class="page-subtitle">15+ 完整项目，涵盖多个技术领域</p>
        </header>

        <div class="projects-grid fade-up">
            <div class="project-card">
                <div class="project-image">
                    <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img1.jpg" alt="智能小车">
                </div>
                <div class="project-content">
                    <h3>智能循迹小车</h3>
                    <p>基于 STM32 的智能循迹小车，配备多种传感器，实现自主导航与避障功能。</p>
                    <div class="project-tags">
                        <span class="project-tag">STM32</span>
                        <span class="project-tag">传感器</span>
                        <span class="project-tag">PID控制</span>
                    </div>
                </div>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img2.jpg" alt="智能家居">
                </div>
                <div class="project-content">
                    <h3>智能家居控制系统</h3>
                    <p>物联网智能家居系统，支持远程控制、语音交互和自动化场景配置。</p>
                    <div class="project-tags">
                        <span class="project-tag">IoT</span>
                        <span class="project-tag">WiFi</span>
                        <span class="project-tag">MQTT</span>
                    </div>
                </div>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img3.jpg" alt="机械臂">
                </div>
                <div class="project-content">
                    <h3>四自由度机械臂</h3>
                    <p>舵机控制机械臂，支持精确位置控制、轨迹规划与抓取作业。</p>
                    <div class="project-tags">
                        <span class="project-tag">舵机控制</span>
                        <span class="project-tag">运动学</span>
                        <span class="project-tag">逆解算</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        (function() {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        })();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    </script>
</body>
</html>
