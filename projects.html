<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目作品 | 崔喆箫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --bg-elevated: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: rgba(0,0,0,0.06);
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg-elevated: #1c1c1e;
            --text: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --border: rgba(255,255,255,0.08);
            --glass-bg: rgba(28, 28, 30, 0.72);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 17px; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 52px;
            padding: 0 max(48px, calc((100vw - 1200px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--glass-border);
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .theme-toggle:hover { opacity: 1; background: var(--border); }

        .page-header {
            padding: 140px 48px 60px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 48px 120px;
        }

        .project-card {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            overflow: hidden;
            border: 0.5px solid var(--border);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .project-image {
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .project-content {
            padding: 28px;
        }

        .project-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .project-content p {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .project-tag {
            padding: 5px 14px;
            background: var(--bg);
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 0.5px solid var(--border);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible { opacity: 1; transform: translateY(0); }

        .fade-in-stagger > * {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-in-stagger.visible > * { opacity: 1; transform: translateY(0); }
        .fade-in-stagger.visible > *:nth-child(1) { transition-delay: 0.1s; }
        .fade-in-stagger.visible > *:nth-child(2) { transition-delay: 0.15s; }
        .fade-in-stagger.visible > *:nth-child(3) { transition-delay: 0.2s; }

        @media (max-width: 768px) {
            .page-header { padding: 120px 24px 40px; }
            .projects-grid { padding: 0 24px 80px; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </nav>

    <header class="page-header fade-in">
        <h1>项目作品</h1>
        <p>15+ 完整项目，涵盖多个技术领域</p>
    </header>

    <div class="projects-grid fade-in-stagger">
        <div class="project-card">
            <div class="project-image">
                <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img1.jpg" alt="智能小车">
            </div>
            <div class="project-content">
                <h3>智能循迹小车</h3>
                <p>基于 STM32 的智能循迹小车，配备多种传感器，实现自主导航与避障功能。</p>
                <div class="project-tags">
                    <span class="project-tag">STM32</span>
                    <span class="project-tag">传感器</span>
                    <span class="project-tag">PID控制</span>
                </div>
            </div>
        </div>

        <div class="project-card">
            <div class="project-image">
                <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img2.jpg" alt="智能家居">
            </div>
            <div class="project-content">
                <h3>智能家居控制系统</h3>
                <p>物联网智能家居系统，支持远程控制、语音交互和自动化场景配置。</p>
                <div class="project-tags">
                    <span class="project-tag">IoT</span>
                    <span class="project-tag">WiFi</span>
                    <span class="project-tag">MQTT</span>
                </div>
            </div>
        </div>

        <div class="project-card">
            <div class="project-image">
                <img src="https://cdn.jsdelivr.net/gh/TonyDDcui/Self_Introduction@main/Project_record/project_img/img3.jpg" alt="机械臂">
            </div>
            <div class="project-content">
                <h3>四自由度机械臂</h3>
                <p>舵机控制机械臂，支持精确位置控制、轨迹规划与抓取作业。</p>
                <div class="project-tags">
                    <span class="project-tag">舵机控制</span>
                    <span class="project-tag">运动学</span>
                    <span class="project-tag">逆解算</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
            }
        }

        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        })();

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(el => observer.observe(el));
    </script>
</body>
</html>
